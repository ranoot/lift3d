# Semantic-Universe pipeline config. Load with:
#   ./build-cuda/run_semantic_universe --config run.yaml
#   ./build-cuda/viz_semantic_universe --config run.yaml --spawn
# Any key omitted here falls back to its built-in default. CLI overrides:
#   --log <folder>   --out <file.rrd>   --spawn   (take precedence over this file)

# ---- recording ----
log:    ~/dog_logs/20260608_test_log_officePantryNarrowCorridor
calib:  ""            # empty => <log>/../CameraCalRaiboAsQUGV113.xml
cam:    211
out:    recordings/sem_universe_with_3tier_tuning.rrd

# ---- accumulation window ----
start:  0
count:  1000
stride: 2

# ---- map + projection ----
voxel:  0.05          # world voxel fusion size (m)
radius: 6             # fallback for proj_radius when that is unset (m); 0 => whole map
proj_radius: 7.5      # z-buffer CANDIDATE cull radius (m) -- a projection optimization so we
                      # don't project the whole map; NOT a processing window. 0 => use radius
tau:    0.17         # z-buffer visibility tolerance (m)
splat:  2            # z-buffer depth dilation radius (px)
surf_band: 0.75      # working-set front-surface band (m): at each pixel keep every visible
                     # point within this depth of the nearest. 0 => one point/pixel (sparse);
                     # 0.1 keeps the full front surface -> more geometry for clustering

# ---- semantic labelling ----
# By default a point's class is whatever the current frame's 2D segmentation projects
# onto it (naive per-frame backprojection). Turn `voting.enabled` on to accumulate a
# persistent per-point vote histogram instead, so the label is a cross-frame consensus.
things_only: false    # if true, only stamp object (thing) classes

# ---- voting (cross-frame per-point class) ----
# Persistent per-point vote histogram for the backprojected class. Off => naive: the
# class is the last frame's 2D guess (no accumulation). On => every observation votes and
# the class is the STUFF-BIASED argmax of the histogram. stuff_bias (>= 1) up-weights
# stuff votes so a point that has been seen as stuff (wall/floor/ceiling) resists flipping
# to a thing until things outvote stuff past that factor -- curbs objects leaking onto
# walls/floor. min_votes/min_conf are an optional label gate (1 / 0 => plain argmax).
voting:
  enabled:    true   # false => per-frame transient labels (previous behaviour)
  stuff_bias: 2.0     # weight on stuff votes in the argmax (1 => symmetric, no bias)
  min_votes:  2       # min total votes before a class resolves (1 => off)
  min_conf:   0.0     # min winning fraction of raw votes (0 => off)

# ---- inference server + vocabulary ----
endpoint: ipc:///tmp/inf_server.ipc
thing: [door, chair, table, person, trash can, box, monitor, shelf, window, monitor, lockers, meeting pod, whiteboard, sign, fridge, extinguisher]
stuff: [wall, floor, ceiling]
# Dynamic-object classes: their points are DROPPED at ingest (never fused into the map),
# so moving objects leave no smear. Keep them in `thing`/`stuff` above so the 2D model
# still segments them -- that mask is what the filter uses.
dynamic: [person]

# ---- VCCS superpoints (per-frame oversegmentation of the FULL view, incl. stuff/unlabeled) ----
# Runs on the whole front-surface shell (not just thing points) so superpoints follow real
# surfaces and each one is a single object's local geometry; the class histogram supplies
# the semantics for growing.
superpoints:
  enabled:    true
  seed:       0.25     # VCCS seed resolution (m); larger => fewer/larger superpoints
  thing_frac: 0.001     # min fraction of ALL member points (incl. stuff/unlabeled) that
                       # must carry the winning thing class for the superpoint to take it
  spatial:    0.9      # VCCS spatial importance
  normal:     0.5      # VCCS normal importance
  refine:     0        # refineSupervoxels iterations

# ---- object proposals (per-class HDBSCAN* over the per-frame visible thing set) ----
# Runs EVERY frame; proposals are ephemeral (re-clustered each frame, non-claiming) so the
# same object is re-proposed with overlapping voxels for the IoU consolidation below.
hdbscan:
  enabled:              true
  min_pts:              5 # 20    # HDBSCAN* core-distance k (density estimate)
  min_cluster_size:     20 # 30    # smaller clusters dissolve into noise
  min_class_points:     30 # 20    # skip a class with fewer points this frame
  allow_single_cluster: true  # let a single-object class resolve to one proposal
  leaf_selection:       true  # cluster selection: false=EOM (fewer/larger), true=LEAF
                              # (more/smaller/homogeneous -- splits merged blobs). Try true
                              # if proposals over-clump, but keep min_cluster_size modest.
  single_scan:          false  # ONE hdbscan<4> over all classes (class as a far 4th coord)
                              # vs a scan per class; false => per-class fallback
  sor_enabled:          true   # Statistical Outlier Removal before HDBSCAN: drop sparse
                              # points so thin noise bridges can't fuse distinct objects
  sor_mean_k:           12     # neighbors per point for the density estimate
  sor_std_mul:          0.5    # smaller => more aggressive pruning (keeps only denser points)
  use_instance_ids:     false   # INSTANCE-GUIDED seeding: group thing points by (class,
                              # resolved DVIS instance) and seed each group WHOLE, bypassing
                              # HDBSCAN. An InstanceIdGraph bridges DVIS over-segmentation
                              # (adjacent same-class ids -> one object) so each seed is one
                              # physical instance; min_cluster_size still gates out dust, and
                              # points with no instance id fall back to per-class HDBSCAN.
                              # false => pure-geometry single_scan/per-class clustering.

# ---- class-histogram-guided growing (superpoints -> this frame's proposals) ----
# SAI3D region affinity = cosine(class histograms) * containment(shared voxels / superpoint
# voxels). VCCS now runs on the FULL view, so a dominant-thing superpoint carries a class
# histogram; it merges into its best-affinity proposal (and ALL its points, incl. unlabeled
# boundary, are absorbed) when affinity >= threshold. Cosine ~1 for a matched class, so this
# threshold is effectively a containment floor -- start ~0.4-0.5 and tune.
grow:
  enabled:        true
  affinity:       0.10   # merge threshold on cosine(hist) * containment
  require_class:  true   # only merge a superpoint into a proposal of the same thing class
  # SAI3D neighborhood-aware growing (opt-in; defaults reproduce the legacy single greedy pass)
  neighbor_pool:  true  # pool each superpoint's histogram over its KNN neighbors before cosine
  sweeps:         3      # assignment sweeps (>1 revisits superpoints as objects grow)
  dis_decay:      0.2    # decay weight applied to neighbor histograms when pooling
  pool_k:         4      # KNN count over superpoint centroids for pooling

# ---- objects tier (proposals -> objects, single-tier Union-Find over the seed layer) ----
# Every per-frame proposal is retained as a persistent SEED. A Union-Find groups seeds that
# are the same physical object: a new seed is unioned into every same-class component it is
# CONTAINED in (shared voxels / new-seed voxels) past that component's level bar. A
# component's support = its member-seed count; it becomes a reported OBJECT once support
# reaches min_merges. Objects are virtual (no committed object entity) -- this is the
# pipeline's primary output. Progressive merging (SGS-3D / SAI3D), not a one-shot promotion.
objects:
  enabled:       true
  merge_thresh:  [0.55, 0.45, 0.35, 0.30, 0.30, 0.30, 0.25, 0.25, 0.25, 0.25, 0.15]  # union bar by component level (level 1 strictest .. top loosest)
  min_merges:    21       # merged observations a component needs before it is a reported object
  require_class: true   # only union seeds of the same thing class
  consol_stride: 1       # fold proposals only every Nth frame (skip near-duplicate adjacent views); 1 = every frame
  # ---- SAI3D global-context merging (opt-in; global_context=false => legacy single-frame path) ----
  # When enabled, inter-object merges are NOT decided from one frame's voxel overlap. Each frame
  # deposits confidence-weighted affinity (semantic-histogram cosine * visibility) onto a
  # persistent edge graph (adj = sum sim*conf / sum conf), and two objects merge only once that
  # accumulated affinity clears the level bar with enough evidence AND a neighborhood-aggregated
  # score agrees (SAI3D judge_connect). Kills single-frame spurious bridges.
  global_context:        true  # master switch for the accumulated-affinity merge path
  min_evidence:          2.2    # min accumulated confidence before any inter-object merge
  dis_decay:             0.5    # neighborhood-aggregation decay (judge_connect)
  use_semantic_affinity: true   # include cosine(class histogram) in the per-frame deposit
  use_containment:       true   # multiply each deposit by voxel containment (shared/min(|P|,|comp|))
                                # so a grazing overlap accrues weak evidence -- curbs over-merging
  use_instance_ids:      false  # boost affinity when DVIS instance ids co-touch (InstanceIdGraph)
  id_bonus:              0.10   # similarity boost applied on an instance-id overlap
  small_seg_min:         0      # finish() cleanup: absorb comps with support < this (0 = off)
  # ---- Overlapping point-set model (opt-in; overlap_sets=false => exclusive-ownership path) ----
  # When true, higher layers stop OWNING points: a superpoint is grown into EVERY matching
  # proposal (not just its best) and points are never exclusively claimed, so proposals become
  # overlapping bags of points (curing the "points gobbled up -> sparse proposals -> meaningless
  # containment" failure). Tier-3 becomes a virtual Union-Find whose sets are collections of
  # proposals: a voxel may belong to several components, overlap is located via a
  # voxel->{components} index, and the FINAL objects are made disjoint by assigning each
  # contested voxel to its highest-support component. false => the exclusive path, byte-for-byte.
  overlap_sets:          true
